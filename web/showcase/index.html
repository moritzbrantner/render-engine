<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>render-engine: shooter frames on WebGPU</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #10141a;
        color: #e8ecf2;
        font: 13px/1.45 system-ui, sans-serif;
      }
      #view {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #panel {
        position: fixed;
        top: 12px;
        left: 12px;
        max-width: min(420px, calc(100% - 24px));
        padding: 10px 12px;
        border-radius: 6px;
        background: rgb(16 20 26 / 0.78);
      }
      #panel h1 {
        margin: 0 0 6px;
        font-size: 14px;
      }
      #panel label,
      #panel button,
      #panel select {
        font: inherit;
        margin-right: 6px;
      }
      #status[role='alert'] {
        color: #ffb4a8;
      }
      #stats {
        margin: 6px 0 0;
        white-space: pre-wrap;
        font: 12px/1.4 ui-monospace, monospace;
        color: #b9c3d0;
      }
      /* The harness captures at a fixed size without the overlay. */
      body.capture #panel {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="panel">
      <h1>Shooter frames on render-engine (WebGPU)</h1>
      <p id="status" role="status">Starting…</p>
      <div id="controls" hidden>
        <label>Frame <select id="frame"></select></label>
        <label>View
          <select id="camera">
            <option value="orbit">Orbit</option>
            <option value="eye">Viewer's eye</option>
          </select>
        </label>
        <button id="lose" type="button" title="Destroys the GPU device; the page re-creates it">Lose device</button>
      </div>
      <pre id="stats"></pre>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
