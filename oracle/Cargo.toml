[package]
name = "render-oracle"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "oracle"
description = "Bevy oracle: renders each parity scenario on Bevy and render-engine, compares them with FLIP and times both on the GPU"

[dependencies]
render-engine = { path = ".." }
bevy = { version = "0.20.1", default-features = false, features = [
    "3d_bevy_render",
    "default_app",
    "multi_threaded",
    "png",
] }
nv-flip = "0.1.2"
image = { version = "0.25.10", default-features = false, features = ["png"] }
pollster = "1.0.1"
serde_json = "1.0"

[[bin]]
name = "oracle"
path = "src/main.rs"
