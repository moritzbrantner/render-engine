[package]
name = "render-oracle"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "oracle"
description = "Bevy oracle: renders each parity scenario on Bevy and render-engine, compares them with FLIP and times both on the GPU"

[dependencies]
render-engine = { path = ".." }
bevy = { version = "0.20.1", default-features = false, features = [
    "3d_bevy_render",
    "default_app",
    "experimental_pbr_pcss",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "zstd_rust",
] }
# Particle oracle (technical decisions D9). The latest release (0.19) is on Bevy 0.19; Bevy 0.20
# support (djeedai/bevy_hanabi#576) is on main, so the oracle pins a main commit until 0.20 ships.
bevy_hanabi = { git = "https://github.com/djeedai/bevy_hanabi", rev = "d277555d4a", default-features = false, features = ["3d"] }
nv-flip = "0.1.2"
image = { version = "0.25.10", default-features = false, features = ["hdr", "png"] }
pollster = "1.0.1"
# Seeds bevy_hanabi's CPU `Random` resource (its own type).
rand_pcg = "0.10"
serde_json = "1.0"
gltf = "1.4.1"

[[bin]]
name = "oracle"
path = "src/main.rs"
