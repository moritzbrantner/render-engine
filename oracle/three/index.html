<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>render-engine oracle: three.js side</title>
    <script type="importmap">
      {
        "imports": {
          "three": "/node_modules/three/build/three.module.js",
          "three/addons/": "/node_modules/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <script type="module">
      import { renderScenario } from './scene.js';
      const q = new URLSearchParams(location.search);
      renderScenario(q.get('scene'), Number(q.get('frames') ?? 0))
        .then((r) => (window.oracleResult = r))
        .catch((e) => (window.oracleResult = { error: `${e.message}\n${e.stack}` }));
    </script>
  </body>
</html>
