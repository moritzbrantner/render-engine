name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # GitHub runners have no GPU: every wgpu adapter (render-engine and Bevy) is lavapipe.
  WGPU_FORCE_FALLBACK_ADAPTER: "1"

jobs:
  docs-scope:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail-closed Markdown-only PR classification
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "docs-only=false" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then exit 0; fi
          mapfile -d '' changed < <(git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA")
          if (( ${#changed[@]} == 0 )); then exit 0; fi
          for file in "${changed[@]}"; do
            if [[ "$file" != *.md ]]; then exit 0; fi
          done
          echo "docs-only=true" >> "$GITHUB_OUTPUT"

  # The engine crate alone: never compiles Bevy.
  tests:
    needs: docs-scope
    if: needs.docs-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the rust-toolchain.toml toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1 vulkan-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: |
          cargo fmt --all -- --check
          (cd oracle && cargo fmt -- --check)

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # A crashing test binary leaves a core dump (#122); the job still fails on it.
      - name: Tests (headless render on lavapipe)
        id: tests
        env:
          CORE_DIR: ${{ runner.temp }}/cores
        run: |
          sudo --preserve-env=CORE_DIR bash scripts/crash-stacks.sh enable
          bash scripts/crash-stacks.sh env
          ulimit -c unlimited
          cargo test --locked

      - name: Crash stacks
        if: failure() && steps.tests.outcome == 'failure'
        env:
          CORE_DIR: ${{ runner.temp }}/cores
        run: |
          sudo apt-get install -y --no-install-recommends gdb
          bash scripts/crash-stacks.sh report

      - name: Upload crash cores and backtraces
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crash-stacks
          path: ${{ runner.temp }}/cores
          retention-days: 14
          if-no-files-found: ignore

  # Oracle clippy and unit tests and the three-lighting unit tests: no rendering, but for
  # Lighting.prepare's test in headless Chromium (SwiftShader).
  oracle-checks:
    needs: docs-scope
    if: needs.docs-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the rust-toolchain.toml toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: oracle -> target

      - name: Clippy (oracle)
        working-directory: oracle
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Tests (oracle)
        working-directory: oracle
        run: cargo test --release --locked

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install npm dependencies and headless Chromium
        run: |
          bun install --frozen-lockfile
          bunx --no-install playwright install --with-deps chromium-headless-shell

      - name: three-lighting tests
        run: bun test packages

  # The Bevy oracle in four parallel slices (`--shard`): FLIP image gate enforced on lavapipe.
  # No GPU timing: lavapipe times gate nothing; the GPU-time gate is local (AGENTS.md).
  oracle-shard:
    needs: docs-scope
    if: needs.docs-scope.outputs.docs-only != 'true'
    name: oracle ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the rust-toolchain.toml toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: oracle -> target

      # The oracle's three.js side (D8): three, Playwright and headless Chromium (SwiftShader).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install npm dependencies and headless Chromium
        run: |
          bun install --frozen-lockfile
          bunx --no-install playwright install --with-deps chromium-headless-shell

      - name: Bevy oracle (FLIP image gate on render-engine and three.js)
        run: cargo run --release --locked --manifest-path oracle/Cargo.toml -- --no-timing --shard ${{ matrix.shard }}/4 --out target/oracle

      - name: Upload this slice's images and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-shard-${{ matrix.shard }}
          path: |
            target/oracle/*.png
            target/oracle/*.bevy.json
            target/oracle/report.json
          retention-days: 1
          if-no-files-found: warn

  # The browser gate (D8, #129): render-engine compiled to wasm32 in Playwright's Firefox on
  # WebGPU, which runs on lavapipe here like the oracle (Chromium only offers SwiftShader, whose
  # sRGB rounding differs), against this run's oracle images with D3's gates and D9's tiers.
  browser:
    needs: [docs-scope, oracle-shard]
    if: always() && needs.docs-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the rust-toolchain.toml toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
          # Firefox offers WebGPU only with a display: Xvfb, with Mesa's GL for its driver probe.
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: oracle/webgpu-smoke -> target

      # The CLI must match the smoke's wasm-bindgen exactly.
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.130 --locked

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - name: Install npm dependencies and Firefox
        run: |
          bun install --frozen-lockfile
          bunx --no-install playwright install --with-deps firefox

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oracle-shard-*
          path: shards

      - name: Oracle images and Bevy runs
        run: |
          mkdir -p target/oracle
          cp shards/*/*.png shards/*/*.bevy.json target/oracle/

      - name: Browser gate (Firefox, WebGPU on lavapipe)
        env:
          SMOKE_BROWSER: firefox
        run: xvfb-run -a bash scripts/browser-gate.sh target/oracle

      - name: Upload the browser captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-gate
          path: |
            target/oracle/*.webgpu*.png
            target/oracle/*.webgpu*.json
          retention-days: 7
          if-no-files-found: warn

  # Joins the slices into one report (and the Pages site) and fails when any oracle job failed.
  oracle:
    needs: [docs-scope, oracle-checks, oracle-shard]
    if: always() && needs.docs-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: oracle-shard-*
          path: shards

      - name: Join the slices
        run: |
          mkdir -p target/oracle
          shopt -s nullglob
          cp shards/*/*.png target/oracle/
          reports=(shards/oracle-shard-*/report.json)
          if (( ${#reports[@]} )); then
            # Slices are contiguous, so shard order is list order.
            jq -s '.[0] + {scenarios: map(.scenarios[]), particles: map(.particles[])}' "${reports[@]}" > target/oracle/report.json
          fi

      - name: Oracle report
        run: bash scripts/build-pages.sh

      - name: Upload oracle images and report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-report
          path: pages-dist
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.oracle-shard.result == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-dist

      - name: Every oracle job passed
        run: |
          echo "oracle-checks: ${{ needs.oracle-checks.result }}, oracle-shard: ${{ needs.oracle-shard.result }}"
          [[ "${{ needs.oracle-checks.result }}" == success && "${{ needs.oracle-shard.result }}" == success ]]

  # The oracle report site (site/ + this run's oracle output), published from main.
  pages:
    needs: oracle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: [docs-scope, tests, oracle, browser]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["docs-scope", "tests", "oracle", "browser"]'
          allow-skipped: ${{ needs.docs-scope.outputs.docs-only == 'true' && '["tests", "oracle", "browser"]' || '[]' }}
