name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # GitHub runners have no GPU: every wgpu adapter (render-engine and Bevy) is lavapipe.
      WGPU_FORCE_FALLBACK_ADAPTER: "1"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the rust-toolchain.toml toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            oracle -> target

      - name: Format
        run: |
          cargo fmt --all -- --check
          (cd oracle && cargo fmt -- --check)

      - name: Clippy
        run: |
          cargo clippy --all-targets --locked -- -D warnings
          (cd oracle && cargo clippy --release --all-targets --locked -- -D warnings)

      - name: Tests (headless render on lavapipe)
        run: |
          cargo test --locked
          (cd oracle && cargo test --release --locked)

      - name: Bevy oracle (FLIP image gate; GPU time advisory on lavapipe)
        run: cargo run --release --locked --manifest-path oracle/Cargo.toml -- --out target/oracle

      - name: Oracle report
        if: always()
        run: bash scripts/build-pages.sh

      - name: Upload oracle images and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-report
          path: pages-dist
          retention-days: 7
          if-no-files-found: warn

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["validate"]'
