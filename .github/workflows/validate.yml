name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # GitHub runners have no GPU: every wgpu adapter (render-engine and Bevy) is lavapipe.
  WGPU_FORCE_FALLBACK_ADAPTER: "1"

jobs:
  docs-scope:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.classify.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fail-closed Markdown-only PR classification
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "docs-only=false" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then exit 0; fi
          mapfile -d '' changed < <(git diff --no-renames --name-only -z "$BASE_SHA...$HEAD_SHA")
          if (( ${#changed[@]} == 0 )); then exit 0; fi
          for file in "${changed[@]}"; do
            if [[ "$file" != *.md ]]; then exit 0; fi
          done
          echo "docs-only=true" >> "$GITHUB_OUTPUT"

  # The engine crate alone: never compiles Bevy.
  tests:
    needs: docs-scope
    if: needs.docs-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the rust-toolchain.toml toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: |
          cargo fmt --all -- --check
          (cd oracle && cargo fmt -- --check)

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests (headless render on lavapipe)
        run: cargo test --locked

  # The Bevy oracle: FLIP image gate enforced on lavapipe, GPU time advisory (no GPU on CI).
  oracle:
    needs: docs-scope
    if: needs.docs-scope.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the rust-toolchain.toml toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Install lavapipe (software Vulkan)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: oracle -> target

      - name: Clippy (oracle)
        working-directory: oracle
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Tests (oracle)
        working-directory: oracle
        run: cargo test --release --locked

      # The oracle's three.js side (D8): three, Playwright and headless Chromium (SwiftShader).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install npm dependencies and headless Chromium
        run: |
          bun install --frozen-lockfile
          bunx --no-install playwright install --with-deps chromium-headless-shell

      - name: three-lighting tests
        run: bun test packages

      - name: Bevy oracle (FLIP image gate on render-engine and three.js; GPU time advisory)
        run: cargo run --release --locked --manifest-path oracle/Cargo.toml -- --out target/oracle

      - name: Oracle report
        if: always()
        run: bash scripts/build-pages.sh

      - name: Upload oracle images and report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-report
          path: pages-dist
          retention-days: 7
          if-no-files-found: warn

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pages-dist

  # The oracle report site (site/ + this run's oracle output), published from main.
  pages:
    needs: oracle
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: [docs-scope, tests, oracle]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["docs-scope", "tests", "oracle"]'
          allow-skipped: ${{ needs.docs-scope.outputs.docs-only == 'true' && '["tests", "oracle"]' || '[]' }}
