# Runs from main and never checks out PR code; forks and bot PRs are excluded.
name: Queue owner PR auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  queue:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == github.event.repository.default_branch &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh pr view "$PR_NUMBER" --repo "$GH_REPO" --json autoMergeRequest,mergeStateStatus)"
          if [[ "$(jq -r '.autoMergeRequest != null' <<<"$pr")" == true ]]; then
            echo "Auto-merge is already enabled."
            exit 0
          fi
          if [[ "$(jq -r '.mergeStateStatus' <<<"$pr")" == CLEAN ]]; then
            echo "PR is already mergeable; direct merge is left to the author so main push workflows run."
            exit 0
          fi
          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --auto --squash
